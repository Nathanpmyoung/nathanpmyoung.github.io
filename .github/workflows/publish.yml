# Publishes nathanpmyoung.com: the Logseq app as before, plus a plain HTML copy of every public
# note (sitegen/) so crawlers that don't run JavaScript can read it.
# The privacy gate must pass or nothing deploys and the live site stays as it was.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: logseq/publish-spa@v0.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate tests (the gate must catch a private page)
        run: python3 sitegen/test_gate.py
      - name: Add plain HTML pages
        run: python3 sitegen/build.py --spa www --out "$RUNNER_TEMP/site"
      - name: Privacy gate
        run: python3 sitegen/gate.py --out "$RUNNER_TEMP/site"
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ runner.temp }}/site
          branch: gh-pages
