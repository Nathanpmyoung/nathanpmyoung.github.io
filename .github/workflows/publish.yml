# Builds nathanpmyoung.com as static HTML: public Logseq pages from this repo plus Substack posts.
# Runs on every push to main (new notes) and daily (new Substack posts).
# The privacy gate must pass or nothing deploys and the live site stays as it was.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate tests (the gate must catch a private page)
        run: python3 sitegen/test_gate.py
      - name: Build
        run: python3 sitegen/build.py --out www
      - name: Privacy gate
        run: python3 sitegen/gate.py --out www
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www
          branch: gh-pages
