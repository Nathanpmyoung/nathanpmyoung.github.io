# Builds nathanpmyoung.com as static HTML: public Logseq pages from this repo plus Substack posts.
# Runs on every push to main (new notes) and when hq dispatches it after saving new Substack
# posts to the substack-data branch (Substack refuses GitHub's runners, so they can't fetch it).
# The privacy gate must pass or nothing deploys and the live site stays as it was.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate tests (the gate must catch a private page)
        run: python3 sitegen/test_gate.py
      - name: Build
        run: |
          git fetch -q origin substack-data
          git show origin/substack-data:posts.json > "$RUNNER_TEMP/posts.json"
          python3 sitegen/build.py --out www --posts "$RUNNER_TEMP/posts.json"
      - name: Privacy gate
        run: python3 sitegen/gate.py --out www
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www
          branch: gh-pages
